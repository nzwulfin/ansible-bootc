---
# mariadb_instance — DB foundation: waits for the socket, creates the
# application database and host-restricted account, and narrows the baked
# firewall rule to the application host. No schema or seed data — the app's
# Alembic migrations own those (applied by app_release).

- name: Verify app_db_password has been changed from default placeholder
  ansible.builtin.assert:
    that:
      - app_db_password != "REPLACE_ME_WITH_A_STRONG_PASSWORD"
    fail_msg: >-
      app_db_password is still set to the default placeholder string
      in ansible/inventory/group_vars/all/vault.yml. Edit that file
      to set a real password, then encrypt it with ansible-vault.

- name: Wait for MariaDB unix socket to be present
  ansible.builtin.wait_for:
    path: "{{ mariadb_socket }}"
    state: present
    timeout: "{{ mariadb_socket_timeout }}"
  # Guarantees first-boot self-initialization finished before module connections.

- name: Create application database
  ansible.mariadb.mariadb_db:
    name: "{{ app_db_name }}"
    state: present
    login_unix_socket: "{{ mariadb_socket }}"
  # Socket login: root access on a fresh install with no root password set.

- name: Create application database user
  ansible.mariadb.mariadb_user:
    name: "{{ app_db_user }}"
    host: "{{ app_host_address }}"
    password: "{{ app_db_password }}"
    priv: "{{ app_db_name }}{{ mariadb_user_priv_suffix }}"
    state: present
    login_unix_socket: "{{ mariadb_socket }}"
  no_log: true
  # DELIBERATE OVER-GRANT: DDL is granted so the app team owns their schema via
  # Alembic, but the running service only uses SELECT/INSERT. Production must
  # split a release-time migration account from a least-privilege runtime
  # account — see docs/project/requirements.md. host: restricts the account to
  # connections from the application host IP.

- name: Remove broad mysql firewall service (image-baked, open to all)
  ansible.posix.firewalld:
    service: "{{ mariadb_firewall_service }}"
    state: disabled
    permanent: true
    immediate: true

- name: Allow MySQL only from application host (firewall rich rule)
  ansible.posix.firewalld:
    rich_rule: "rule family='ipv4' source address='{{ app_host_address }}/32' service name='mysql' accept"
    state: enabled
    permanent: true
    immediate: true
