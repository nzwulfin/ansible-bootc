---
# mariadb_instance — role metadata.

galaxy_info:
  role_name: mariadb_instance
  author: ansible-bootc
  description: >
    DB foundation (DBA-owned): creates the application database, the
    application account scoped to its own database, and narrows the firewall
    to the application host. No schema or seed data — the app's Alembic
    migrations own those (app_release). Assumes MariaDB is installed and
    enabled via the database image; root access via the local unix socket.
  license: Apache-2.0
  min_ansible_version: "2.14"

  platforms:
    - name: EL
      versions:
        - "9"
        - "10"

dependencies: []
