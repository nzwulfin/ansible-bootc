---
# mariadb_instance role defaults. Credentials and instance-specific values
# (app_db_name, app_db_user, app_host_address, app_db_password) are resolved
# from group_vars and must never be shadowed here. Schema/seed knobs are
# absent: this role is DB foundation only.

# MariaDB keeps MySQL-compatible upstream names (datadir, socket, firewalld
# service, [mysqld]) — not typos.
mariadb_socket: /var/lib/mysql/mysql.sock

mariadb_socket_timeout: 60   # first-boot initialization can be slow on VMs

# The database image bakes this service open; the role replaces it with a
# source-restricted rich rule.
mariadb_firewall_service: mysql

# DELIBERATE OVER-GRANT: DML + DDL so the app team owns their schema via
# Alembic. See the comment in tasks/main.yml for the production split.
mariadb_user_priv_suffix: ".*:SELECT,INSERT,UPDATE,DELETE,CREATE,ALTER,DROP,INDEX"
