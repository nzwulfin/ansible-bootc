---
# app_instance — tasks/main.yml
#
# First-contact provisioning of the application instance. The order is
# normative (design-spec.md §8.3):
#   1. Ensure the config directory exists.
#   2. Render the runtime config from config.ini.j2 (notify restart on change).
#   3. Enable and start the service (G7: Ansible enables, the image does not).
#   4. Wait for the loopback health endpoint to answer HTTP 200.
#   5. Assert the health body reports database == "connected".
#
# The play sets become: true; root is required for the /etc writes and for
# systemd management. No become: false override is used anywhere in this
# role.
#
# Constraints honoured:
#   G4  — app_db_password is rendered into the template from
#          group_vars/all/vault.yml only; it is never declared in this
#          role's defaults and never appears in any task literal.
#   G7  — the image ships the corp-app unit baked but NOT enabled. This
#          role performs the first-contact enablement, and only after the
#          config file exists (the service cannot start before then).
#   G9  — no package installation; python3 and python3-PyMySQL are baked
#          into the application image.
#   G12 — the template dest /etc/corp-app/config.ini must stay identical to
#          CONFIG_PATH in /usr/local/bin/corp-app.py and to the path the
#          corp-app.service process reads.
#
# No firewall tasks on purpose: the health endpoint binds 127.0.0.1 only,
# so nothing external requires a port and no port may be opened.

- name: Ensure /etc/corp-app/ directory exists
  ansible.builtin.file:
    path: /etc/corp-app
    state: directory
    owner: root
    group: root
    mode: "{{ app_config_dir_mode }}"
  # The service runs as root and reads this directory. Mode is a role
  # default (0750, Appendix B reference).

- name: Deploy application runtime configuration from template
  ansible.builtin.template:
    src: config.ini.j2
    dest: /etc/corp-app/config.ini
    owner: root
    group: root
    mode: "{{ app_config_file_mode }}"
  notify: Restart corp-app
  # G12: dest must match CONFIG_PATH in corp-app.py exactly.
  # The file carries the database password, hence the restrictive mode
  # (0640 root:root, Appendix B reference).
  # A content change notifies the restart handler: corp-app.py parses the
  # config once at startup and caches it, so a running service picks up
  # endpoint/credential changes only after a restart.

- name: Enable and start corp-app (first contact)
  ansible.builtin.systemd:
    name: "{{ app_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
  # G7: the image never enables this unit — Ansible does the enabling at
  # first contact, now that the config file exists. daemon_reload: true
  # guarantees a freshly baked unit file is visible to systemd.

- name: Flush handlers so a config change restarts the service before probes
  ansible.builtin.meta: flush_handlers
  # If config.ini was updated on an already-running host (idempotent re-run),
  # the "Restart corp-app" handler is queued but would not normally execute
  # until the end of the play — after the health and verification probes have
  # already started against the stale process. Flushing here guarantees the
  # restart completes before any probe task runs, so the probes always
  # interrogate the process that read the current config.

- name: Wait for the health endpoint to report HTTP 200
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    method: GET
    status_code: 200
    return_content: true
  register: app_health
  # `default(0)`: while the service is still coming up the request is
  # refused and the result may carry no status key at all; without the
  # default the conditional would error instead of retrying.
  until: app_health.status | default(0) == 200
  retries: "{{ app_health_retries }}"
  delay: "{{ app_health_delay }}"
  # The endpoint is loopback-only (never exposed externally), so the check
  # runs on the host itself. corp-app probes the remote database on every
  # request: a 503 "database: error" body fails the status check and drives
  # the retry loop, so a 200 also proves the database connection.
  # return_content keeps the JSON body for the assertion below.

- name: Verify health endpoint reports a connected database
  ansible.builtin.assert:
    that:
      - app_health.status == 200
      - app_health.json.database == "connected"
    fail_msg: >-
      corp-app health endpoint did not report a connected database:
      status={{ app_health.status | default('unknown') }},
      body={{ app_health.content | default('unavailable') }}.
      Check the database host, the firewall rich rule on the database
      host, and the credentials in /etc/corp-app/config.ini.
    success_msg: >-
      corp-app is healthy: http://127.0.0.1:{{ app_port }}/health
      reports database connected.

- name: Read service root endpoint (GET /)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/"
    method: GET
    status_code: 200
    return_content: true
  register: app_root
  # Retrieves the records array to verify the seed row inserted by
  # mysql_instance on the database host is visible over the network.
  # A 503 here (database error) after a clean /health probe would
  # indicate a race condition or intermittent connectivity issue.

- name: Assert seed record is visible in GET / response
  ansible.builtin.assert:
    that:
      - app_root.status == 200
      - app_root.json.records | selectattr('message', 'equalto', app_seed_message) | list | length > 0
    fail_msg: >-
      GET / did not contain the expected seed record
      (message='{{ app_seed_message }}') in the records array.
      This means either the mysql_instance role did not insert the seed row
      on the database host, or the application cannot read it over the network.
      records={{ app_root.json.records | default([]) | to_json }}.
    success_msg: >-
      Seed record '{{ app_seed_message }}' is present in GET / response.
      Full round-trip proven: mysql_instance seeded the database host;
      corp-app on the application host reads it over the network.
  # Inspects the structured JSON records array rather than performing a
  # brittle substring match on raw content (design-spec.md §8.3 task 5).

- name: Submit POST /record write-verification
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/record"
    method: POST
    body_format: json
    body:
      message: "{{ app_verify_message }}"
    status_code: 201
    return_content: true
  register: app_write
  # Non-idempotent by design (design-spec.md §8.3 idempotency note):
  # each role run inserts one additional verification row. The extra rows
  # are harmless demo data. Do NOT attempt to delete or suppress them —
  # that would mutate state the design accepts as a probe artefact.

- name: Assert write-verification response echoes inserted record
  ansible.builtin.assert:
    that:
      - app_write.status == 201
      - app_write.json.message == app_verify_message
      - app_write.json.id is defined
      - app_write.json.created_at is defined
    fail_msg: >-
      POST /record write-verification failed.
      Expected status 201 and message='{{ app_verify_message }}';
      got status={{ app_write.status | default('unknown') }},
      body={{ app_write.content | default('unavailable') }}.
      Check that the application database account has INSERT permission
      on the service_records table.
    success_msg: >-
      Write verification passed: POST /record returned 201 with
      id={{ app_write.json.id | default('?') }},
      message='{{ app_write.json.message | default('?') }}',
      created_at={{ app_write.json.created_at | default('?') }}.
      Application account has confirmed network write access to the database.
