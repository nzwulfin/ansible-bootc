---
# app_instance — meta/main.yml
#
# Role metadata for dependency declaration and Galaxy publication details.

galaxy_info:
  role_name: app_instance
  author: ansible-bootc
  description: >
    First-contact provisioning of the application instance: writes
    /etc/corp-app/config.ini from a template (G12 path), performs the
    enable-and-start of the corp-app service that the application image
    deliberately leaves disabled (G7), and verifies the loopback-only
    health endpoint reports a connected database.
  license: Apache-2.0
  min_ansible_version: "2.14"

  platforms:
    - name: EL
      versions:
        - "9"
        - "10"

dependencies:
  # No role-level dependencies. This role uses only ansible.builtin
  # modules (file, template, systemd, uri, assert); the collections
  # ansible.mariadb and ansible.posix in ansible/requirements.yml serve
  # the other roles and must be installed regardless.
  []
