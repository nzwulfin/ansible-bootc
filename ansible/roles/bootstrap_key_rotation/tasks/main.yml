---
# bootstrap_key_rotation — installs the live management key and removes the
# bootstrap (PSK) key. Both tasks are no-ops on an already-onboarded host
# (the module matches keys by fingerprint).

- name: Install the live management public key
  ansible.posix.authorized_key:
    user: "{{ authorized_key_user }}"
    state: present
    exclusive: false
    key: "{{ lookup('file', live_pubkey_path) }}"
  # exclusive: false — no other key in authorized_keys is touched.

- name: Remove the bootstrap (PSK) public key
  ansible.posix.authorized_key:
    user: "{{ authorized_key_user }}"
    state: absent
    key: "{{ lookup('file', bootstrap_pubkey_path) }}"
  # Fingerprint matching removes the options-prefixed PSK line cleanly.
