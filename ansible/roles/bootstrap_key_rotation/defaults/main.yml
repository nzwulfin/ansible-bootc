---
# bootstrap_key_rotation role defaults. Paths and the account name only —
# never credentials.

# Account name for the authorized_key module's user: field; the account is
# pinned to UID/GID 5000 in the base image, but this field takes the name.
authorized_key_user: ansible

# Used by the play-level ansible_ssh_private_key_file fallback in
# playbooks/bootstrap.yml; relative to the ansible/ run directory.
bootstrap_key_path: keys/id_bootstrap

# playbook_dir keeps the file lookups correct from site.yml and standalone
# playbooks alike.
bootstrap_pubkey_path: "{{ playbook_dir }}/../keys/id_bootstrap.pub"
live_pubkey_path: "{{ playbook_dir }}/../keys/id_live.pub"
