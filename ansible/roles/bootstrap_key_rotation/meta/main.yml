---
# bootstrap_key_rotation — role metadata.

galaxy_info:
  role_name: bootstrap_key_rotation
  author: ansible-bootc
  description: >
    Onboards a fresh bootc host: installs the live management key and removes
    the bootstrap (PSK) key. Idempotent — a no-op on an already-onboarded host.
  license: Apache-2.0
  min_ansible_version: "2.14"

  platforms:
    - name: EL
      versions:
        - "9"
        - "10"

dependencies: []
