---
# app_proof_of_life — meta/main.yml
#
# Role metadata for dependency declaration and Galaxy publication details.

galaxy_info:
  role_name: app_proof_of_life
  author: ansible-bootc
  description: >
    Optional functional verification role that exercises the corporate application
    OVER THE NETWORK from the control node after the external firewall port has
    been deliberately opened (G19). Asserts: GET /health returns 200 with
    database='connected'; the Alembic migration seed ('ansible-bootstrap') is
    visible in GET / records; POST /record succeeds with 201 and the echoed
    record; a malformed POST /record body is rejected with 400.

    All tasks run via delegate_to: localhost targeting http://{{ ansible_host }}:{{ app_port }}/
    — the real network path, not loopback. This role is invoked exclusively by
    04_proof_of_life.yml (G17: never by site.yml, never a deployment prerequisite).
    Each run adds one harmless write-probe row (documented non-idempotent behaviour).
  license: Apache-2.0
  min_ansible_version: "2.14"

  platforms:
    - name: EL
      versions:
        - "9"
        - "10"

dependencies:
  # No role-level collection dependencies. All modules used by this role
  # (ansible.builtin.uri, ansible.builtin.assert) are in ansible.builtin and
  # require no additional collection installation beyond what the project
  # requirements.yml already declares (ansible.posix, used by the firewall-exposure
  # play in 04_proof_of_life.yml).
  []
