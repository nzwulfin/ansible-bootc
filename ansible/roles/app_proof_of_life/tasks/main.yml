---
# app_proof_of_life — functional verification on the application host over
# loopback: health, seed visibility (GET /), write probe (POST /record),
# negative input. The write probe adds one row per run — deliberate; probe
# rows are not deleted.

- name: Wait for application health endpoint on loopback
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    method: GET
    status_code: 200
    return_content: true
  register: app_health
  until: app_health.status | default(0) == 200
  retries: "{{ proof_health_retries }}"
  delay: "{{ proof_health_delay }}"

- name: Assert health endpoint reports database connected
  ansible.builtin.assert:
    that:
      - app_health.status == 200
      - app_health.json.database == "connected"
    fail_msg: >-
      Health check failed: HTTP {{ app_health.status | default('no response') }},
      database={{ (app_health.json | default({})).database | default('unknown') }}.
    success_msg: >-
      Health check passed: HTTP 200, database connected on
      http://127.0.0.1:{{ app_port }}/health.

- name: Fetch application root endpoint (GET /)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/"
    method: GET
    status_code: 200
    return_content: true
  register: app_root

- name: Assert seed record is visible in GET / response
  ansible.builtin.assert:
    that:
      - app_root.status == 200
      - app_root.json.records | selectattr('message', 'equalto', proof_seed_message) | list | length > 0
    fail_msg: >-
      GET / did not contain the expected seed record
      (message='{{ proof_seed_message }}') in the records array.
    success_msg: >-
      Seed record '{{ proof_seed_message }}' is present in GET / response.
      Database connectivity and migration seed verified.

- name: Submit POST /record write-verification probe
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/record"
    method: POST
    body_format: json
    body:
      message: "{{ proof_verify_message }}"
    status_code: 201
    return_content: true
  register: app_write

- name: Assert write-verification response echoes inserted record
  ansible.builtin.assert:
    that:
      - app_write.status == 201
      - app_write.json.message == proof_verify_message
      - app_write.json.id is defined
      - app_write.json.created_at is defined
    fail_msg: >-
      POST /record write-verification failed:
      status={{ app_write.status | default('unknown') }},
      body={{ app_write.content | default('unavailable') }}.
    success_msg: >-
      Write verification passed: POST /record returned 201 with
      id={{ app_write.json.id | default('?') }},
      message='{{ app_write.json.message | default('?') }}'.
      Application has confirmed write access to the database.

- name: Submit malformed POST /record (negative validation)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/record"
    method: POST
    body_format: json
    body: {}
    status_code: 400
    return_content: true
  register: app_neg

- name: Assert malformed request was rejected with HTTP 400
  ansible.builtin.assert:
    that:
      - app_neg.status == 400
    fail_msg: >-
      Malformed request was not rejected with 400:
      status={{ app_neg.status | default('unknown') }}.
    success_msg: >-
      Input validation passed: malformed request correctly rejected with HTTP 400.
