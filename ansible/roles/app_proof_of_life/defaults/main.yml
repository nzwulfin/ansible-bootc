---
# app_proof_of_life role defaults. Only invoked by proof_of_life.yml, never by
# a deployment play. app_port and ansible_host resolve from inventory/group_vars.

# Written by the POST /record probe; one row is added per run, deliberately.
proof_verify_message: "ansible-proof-of-life"

# Must match the seed message inserted by the app's initial Alembic migration.
proof_seed_message: "ansible-bootstrap"

# Retries cover transient latency, not service startup — the service should
# already be running when this role executes.
proof_health_retries: 5
proof_health_delay: 2
