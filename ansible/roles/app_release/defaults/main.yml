---
# app_release role defaults. group_vars/application/vars.yml overrides these
# for the 'application' group. Credentials and instance values are deliberately
# not declared here.

app_root: "/opt/corp-app"
app_venv: "{{ app_root }}/venv"
app_service_name: "corp-app"

# `python3 -m alembic` because --system-site-packages venvs do not copy CLI
# wrapper scripts into the venv bin directory.
alembic_bin: "{{ app_venv }}/bin/python3 -m alembic"

# Alembic reads the DB connection from /etc/corp-app/config.ini, so migrations
# and the running service target the same database.
alembic_config: "{{ app_root }}/migrations/alembic.ini"

app_health_retries: 30   # 30 x 5 s = up to 150 s for service startup
app_health_delay: 5
