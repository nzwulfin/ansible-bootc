---
# app_release — tasks/main.yml
#
# Brings the deployed application payload to life: applies the app-owned schema
# via Alembic, enables and starts the service, then confirms the service came up
# with a single loopback readiness gate. No functional exercises, no firewall
# exposure.
#
# Task sequence (design-spec.md §8.4):
#   1. Run Alembic migrations (create service_records + idempotent seed)
#   2. Enable and start corp-app.service (G7: Ansible owns enable/start)
#   3. Loopback readiness gate — poll /health until 200 (G17, G19)
#   4. Assert health endpoint reports database == "connected"
#
# Constraints honoured:
#   G4  — app_db_password not declared here; Alembic resolves it via
#          /etc/corp-app/config.ini (written by app_deploy, G12)
#   G7  — Ansible enables/starts the unit; the image never did
#   G9  — no OS package installation
#   G17 — readiness gate is the ONLY verification permitted in release;
#          no GET / seed assertions, no POST /record write probes, no
#          negative-input tests (those are app_proof_of_life, §8.5)
#   G19 — no external firewall port opened; readiness gate runs over loopback
#          so it passes while the service remains externally unreachable
#          (default-deny teaching moment)

- name: Run database migrations with Alembic
  ansible.builtin.command:
    cmd: "{{ alembic_bin }} -c {{ alembic_config }} upgrade head"
    chdir: "{{ app_root }}/migrations"
  register: alembic_result
  changed_when: >-
    'Running upgrade' in alembic_result.stdout or
    'Running upgrade' in alembic_result.stderr
  # Alembic's version tracking (alembic_version table) makes this idempotent:
  # when the database is already at head, 'upgrade head' emits no 'Running upgrade'
  # line and changed_when evaluates to false.
  #
  # This task creates the service_records table and inserts the single
  # 'ansible-bootstrap' seed row (design-spec.md §6.5). The seed is applied
  # idempotently by the migration — a re-run does not duplicate the row.
  #
  # The app DB account (DDL-on-own-database, §8.2) is the credential; Alembic
  # reads the connection URL from /etc/corp-app/config.ini (G12), ensuring
  # migrations and the running service always target the identical database.
  #
  # chdir sets the working directory so Alembic can locate the versions/
  # subdirectory relative to alembic.ini (consistent with the migration tree
  # layout produced by app_deploy, §8.3 task 2).

- name: Enable and start corp-app service
  ansible.builtin.systemd:
    name: "{{ app_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
  # G7: Ansible owns the enable/start lifecycle. The application image carries
  # no corp-app.service unit and never enables or starts the service.
  # app_deploy renders the unit to /etc/systemd/system/corp-app.service
  # (instance-owned, not baked); this task is the first and only place the
  # service is brought to life.
  #
  # daemon_reload: true ensures systemd picks up the unit file rendered by
  # app_deploy even if this play runs in a fresh session after app_deploy.
  # It is a no-op if the unit file has not changed since the last reload.

- name: Wait for loopback health endpoint to respond
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    method: GET
    status_code: 200
    return_content: true
  register: app_health
  until: app_health.status | default(0) == 200
  retries: "{{ app_health_retries }}"
  delay: "{{ app_health_delay }}"
  # G17: This loopback poll is the ONLY verification permitted in the release
  # role — a liveness confirmation that the service came up, not a functional
  # test. All functional verification (GET / seed assertions, POST /record write
  # probes, negative-input checks) lives exclusively in app_proof_of_life (§8.5).
  #
  # G19: The URI targets 127.0.0.1 (loopback on the app host), not the external
  # IP. The service binds 0.0.0.0 but the external firewall port is NOT opened
  # by this role — the check succeeds while the service remains externally
  # unreachable. This is the expected, documented post-release state (default-deny
  # posture); external exposure is a deliberate, separately-labelled step in
  # 04_proof_of_life.yml.
  #
  # app_port is declared in group_vars/application/vars.yml (not a role default,
  # per the §8.4 defaults contract).

- name: Assert health endpoint reports database connected
  ansible.builtin.assert:
    that:
      - app_health.status == 200
      - app_health.json.database == "connected"
    fail_msg: >-
      Health check failed: HTTP {{ app_health.status | default('no response') }},
      database={{ app_health.json.database | default('unknown') }}.
      Check corp-app.service logs: journalctl -u corp-app --no-pager -n 50
    success_msg: >-
      Service is healthy: HTTP 200, database connected.
  # Confirms that the service is not only reachable (Task 3) but has successfully
  # established a database connection — the minimum bar for declaring the release
  # successful. A 200 response with database != "connected" would indicate a
  # partially-degraded start (e.g., DB connection pool issue) that should fail
  # the release rather than pass it silently.
  #
  # This is NOT a functional test: no data is read, no writes are performed,
  # and no seed content is asserted (G17). The proof-of-life role asserts seed
  # visibility and exercises the full read/write path over the network (§8.5).
