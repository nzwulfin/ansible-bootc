---
# app_release — meta/main.yml
#
# Role metadata for dependency declaration and Galaxy publication details.

galaxy_info:
  role_name: app_release
  author: ansible-bootc
  description: >
    Brings the deployed corporate application payload to life: applies the
    app-owned database schema via Alembic (creating service_records and the
    idempotent 'ansible-bootstrap' seed, §6.5), enables and starts
    corp-app.service (G7 — Ansible owns the enable/start lifecycle, the image
    never does), and confirms the service is healthy via a single loopback
    readiness gate (http://127.0.0.1:{{ app_port }}/health, G17). Does NOT
    perform functional application exercises (those are app_proof_of_life,
    §8.5, G17) and does NOT open any external firewall port (G19 — deliberate
    default-deny teaching moment: the service works on loopback yet remains
    externally unreachable until a human explicitly exposes it).
  license: Apache-2.0
  min_ansible_version: "2.14"

  platforms:
    - name: EL
      versions:
        - "9"
        - "10"

dependencies:
  # No role-level collection dependencies. All modules used by this role
  # (ansible.builtin.command, ansible.builtin.systemd, ansible.builtin.uri,
  # ansible.builtin.assert) are in ansible.builtin and require no additional
  # collection installation.
  []
