---
# app_deploy — installs the application payload, virtualenv, instance config,
# and systemd unit. Does not start the service (app_release) or open ports
# (expose_app).

- name: Gather service facts for conditional handler behaviour
  ansible.builtin.service_facts:

- name: Ensure application root directory exists
  ansible.builtin.file:
    path: "{{ app_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deliver application payload from source tree
  ansible.builtin.copy:
    src: "{{ app_src }}/"
    dest: "{{ app_root }}/"
    owner: root
    group: root
    mode: preserve
  # Trailing slash copies the contents of app_src, not a subdirectory.

- name: Create virtualenv with system site-packages
  ansible.builtin.command:
    cmd: "python3 -m venv --system-site-packages {{ app_venv }}"
    creates: "{{ app_venv }}/bin/activate"
  # --system-site-packages makes the baked corporate Python stack visible
  # without re-installation or re-pinning.

- name: Install app-specific pinned extras from requirements.txt
  ansible.builtin.pip:
    requirements: "{{ app_root }}/requirements.txt"
    virtualenv: "{{ app_venv }}"
  # App extras only — the corporate stack is inherited from system site-packages.

- name: Ensure /etc/corp-app configuration directory exists
  ansible.builtin.file:
    path: /etc/corp-app
    state: directory
    owner: root
    group: root
    mode: "{{ app_config_dir_mode }}"

- name: Deploy application configuration from template
  ansible.builtin.template:
    src: config.ini.j2
    dest: /etc/corp-app/config.ini
    owner: root
    group: root
    mode: "{{ app_config_file_mode }}"
  notify: Restart corp-app
  # dest must stay in sync with the path hardcoded in the app executable.

- name: Deploy corp-app systemd unit from template
  ansible.builtin.template:
    src: corp-app.service.j2
    dest: /etc/systemd/system/corp-app.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart corp-app
  register: _corp_app_unit

- name: Reload systemd daemon after unit file created or changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: _corp_app_unit.changed
  # Guarantees the unit is visible to app_release even on first deployment,
  # when the restart handler is skipped (service not yet running).
