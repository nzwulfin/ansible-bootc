---
# app_deploy role defaults. group_vars/application/vars.yml overrides these for
# the 'application' group. Credentials and instance values (app_db_password,
# app_db_name/user, db_host, app_port) are deliberately not declared here.

# /opt resolves under /var/opt on bootc — persistent, preserved across
# upgrade/rollback. No application code is baked into the image.
app_root: "/opt/corp-app"

app_venv: "{{ app_root }}/venv"

# Payload source tree, resolved from inventory_dir so the path holds whether
# the role is invoked via site.yml or a standalone playbook.
app_src: "{{ inventory_dir ~ '/../../app/corp-app' }}"

# Entrypoint rendered into corp-app.service: the venv interpreter keeps the
# corporate stack and app extras on sys.path.
app_entrypoint: "{{ app_venv }}/bin/python3 {{ app_root }}/src/main.py"

app_config_dir_mode: "0750"     # /etc/corp-app carries app_db_password
app_config_file_mode: "0640"

app_service_name: "corp-app"

db_port: 3306
