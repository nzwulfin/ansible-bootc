---
# app_deploy handlers — both listen on 'Restart corp-app'. daemon_reload always
# runs; the restart is conditional so a first deployment (service not yet
# started by app_release) reloads the unit without starting anything.

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  listen: Restart corp-app

- name: Restart corp-app service
  ansible.builtin.systemd:
    name: "{{ app_service_name }}"
    state: restarted
    daemon_reload: true
  when: >-
    ansible_facts.services is defined and
    (ansible_facts.services[app_service_name ~ '.service']
     | default({'state': 'stopped'})).state == 'running'
  listen: Restart corp-app
  # Restarts only when the service is already running; ansible_facts.services
  # is populated by the service_facts task in tasks/main.yml.
