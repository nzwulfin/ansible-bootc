# ansible.cfg — Control-node configuration for the bootc + Ansible reference pattern.
#
# IMPORTANT: All ansible-playbook invocations must be run from the ansible/ directory.
# Every path in this file is relative to that directory (G11). Running from the repo
# root will cause path resolution failures for the inventory, roles, vault password
# file, and private key.
#
# Example:
#   cd ansible/
#   ansible-playbook site.yml

[defaults]
# Inventory file — relative to ansible/ (G11).
inventory = inventory/hosts.yml

# Role search path — relative to ansible/ (G11).
roles_path = roles

# Vault password file — relative to ansible/ (G11).
# Generate this file and add a strong random string; it is gitignored.
# Under AAP, vault files are replaced by custom credentials/survey variables.
vault_password_file = keys/.vault_pass

# Default private key for all plays — the live management key (relative to ansible/, G11).
# The bootstrap playbook (00_bootstrap.yml) overrides this per-play for the PSK phase.
private_key_file = keys/id_live

# Management account — must match the account baked into the base image.
remote_user = ansible

# Host key checking is disabled for demo convenience.
# PRODUCTION: set to 'accept-new' or pre-populate known_hosts for your environment.
# Disabling this entirely leaves the control node vulnerable to MITM attacks.
host_key_checking = False

[ssh_connection]
# SSH pipelining is required for correct sudo behaviour with NOPASSWD accounts (G10).
# Without pipelining, sudo with requiretty (the default on some distributions) will
# fail when Ansible tries to transfer module files over the same SSH connection.
# pipelining = True eliminates the temporary file transfer and resolves this correctly.
pipelining = True
