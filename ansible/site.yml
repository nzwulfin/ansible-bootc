---
# site.yml — Master playbook entrypoint for standalone deployment execution.
#
# This file runs the four deployment phases in sequence. Each phase maps to a
# distinct team ownership boundary:
#
#   bootstrap.yml   — Platform / security team
#                     PSK probe → key rotation → live-key verification.
#                     Onboards a freshly provisioned host from the bootstrap
#                     (PSK) credential to the live management credential.
#
#   database.yml    — DBA team
#                     MariaDB foundation: creates the application database,
#                     the application account with scoped privileges, and
#                     narrows the baked-in firewall rule to the app host only.
#                     Schema and seed data are NOT created here — those are
#                     app-team territory, applied via Alembic in app_release.
#
#   app_deploy.yml  — App-feature team (play 1 of 2)
#                     Installs the application payload to /opt/corp-app, creates
#                     the virtualenv with system site-packages, installs pinned
#                     extras, renders /etc/corp-app/config.ini and the
#                     /etc/systemd/system/corp-app.service unit.
#                     The service is NOT enabled or started here.
#
#   app_release.yml — App-feature team (play 2 of 2)
#                     Runs the app's Alembic migrations (schema + seed row),
#                     enables and starts corp-app, then confirms the service
#                     came up via a single loopback readiness gate on /health.
#
# NOTE — Post-deployment playbooks (proof_of_life.yml, expose_app.yml) are
# NOT imported here (G17). They are run by hand after deployment:
#   cd ansible/
#   ansible-playbook playbooks/proof_of_life.yml  # on-host verification
#   ansible-playbook playbooks/expose_app.yml     # open external firewall port
#
# Standalone usage (all four deployment phases, from the ansible/ directory — G11):
#   cd ansible/
#   ansible-playbook site.yml
#
# AAP usage:
#   Run as separate job templates:
#     - Bootstrap job:  bootstrap.yml  (bootstrap machine credential)
#     - Workload job:   database.yml + app_deploy.yml + app_release.yml
#                       (live machine credential)
#   proof_of_life.yml and expose_app.yml are separate, optional AAP jobs.

- import_playbook: playbooks/bootstrap.yml
- import_playbook: playbooks/database.yml
- import_playbook: playbooks/app_deploy.yml
- import_playbook: playbooks/app_release.yml
