---
# site.yml — runs the four deployment phases in sequence, one per ownership
# boundary:
#   bootstrap.yml   Infrastructure/Operations — PSK probe, key rotation, live-key check
#   database.yml    DBA team — MariaDB database, account, firewall narrowing
#   app_deploy.yml  App Development — payload, venv, config, unit (not started)
#   app_release.yml App Development — migrations, enable/start, loopback readiness gate
#
# Post-deployment exercises (proof_of_life.yml, expose_app.yml) are run by hand
# and are NOT part of site.yml.
#
# Usage (from the ansible/ directory):  ansible-playbook site.yml
# AAP job structure and credentials:    docs/aap-compatibility.md

- import_playbook: playbooks/bootstrap.yml
- import_playbook: playbooks/database.yml
- import_playbook: playbooks/app_deploy.yml
- import_playbook: playbooks/app_release.yml
