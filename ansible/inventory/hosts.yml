---
# hosts.yml — Static inventory for the bootc + Ansible reference pattern.
#
# The ansible_host values are placeholders. setup-demo-host.sh updates them
# automatically at runtime after VMs obtain DHCP leases.
#
# Interface agreements (design-spec.md §7.5, §9):
#   - app01.ansible_host MUST equal app_host_address in group_vars/database/vars.yml
#     (used by mysql_instance for the MariaDB account host restriction and firewall rule).
#   - db01.ansible_host MUST equal db_host in group_vars/application/vars.yml
#     (used by app_instance to write the database endpoint into config.ini).
# If these values diverge the application cannot connect to the database.

all:
  children:
    database:
      hosts:
        db01:
          ansible_host: 192.168.122.10   # Must match db01; set by setup-demo-host.sh at runtime

    application:
      hosts:
        app01:
          ansible_host: 192.168.122.20   # Must match app01; set by setup-demo-host.sh at runtime
