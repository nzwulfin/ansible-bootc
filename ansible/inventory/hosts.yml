---
# hosts.yml — static inventory. The ansible_host values are placeholders;
# setup-demo-host.sh updates them from DHCP leases at runtime. The inline
# "Must match" comments are load-bearing — that script's sed patterns key on them.

all:
  children:
    database:
      hosts:
        db01:
          ansible_host: 192.168.122.10   # Must match db01; set by setup-demo-host.sh at runtime

    application:
      hosts:
        app01:
          ansible_host: 192.168.122.20   # Must match app01; set by setup-demo-host.sh at runtime
