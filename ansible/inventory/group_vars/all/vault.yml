---
# group_vars/all/vault.yml — vault-encrypted shared credentials.
#
# Encrypt before use:
#   cd ansible/ && ansible-vault encrypt inventory/group_vars/all/vault.yml
# Edit an encrypted file:
#   ansible-vault edit inventory/group_vars/all/vault.yml
#
# app_db_password is declared ONLY here — never in a group-specific vault,
# role default, or plaintext file. Under AAP, supply it via a custom
# credential or survey variable, keeping the variable name identical.

# Password for the application's MariaDB account; replace the placeholder
# before encrypting.
app_db_password: "REPLACE_ME_WITH_A_STRONG_PASSWORD"
