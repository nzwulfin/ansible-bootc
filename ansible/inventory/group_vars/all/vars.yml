---
# group_vars/all/vars.yml — non-sensitive variables visible to every host.

# Kept as a directory (not a flat all.yml) so the vault sibling auto-loads;
# flat "all.vault.yml" naming would never be picked up by the host_group_vars
# plugin and would silently strip app_db_password from scope.

# Management account name — must match the account baked into the base image.
ansible_user: ansible

# Public keys written by scripts/generate-demo-keys.sh; consumed by the
# bootstrap_key_rotation role via lookup('file', ...).
bootstrap_pubkey_path: "{{ playbook_dir }}/../keys/id_bootstrap.pub"
live_pubkey_path: "{{ playbook_dir }}/../keys/id_live.pub"

# Shared between mariadb_instance (creates the database/account) and
# app_deploy/app_release (config.ini, Alembic). In all/ because group-scoped
# variables are not visible across groups.
app_db_name: corpapp
app_db_user: corpapp_user
