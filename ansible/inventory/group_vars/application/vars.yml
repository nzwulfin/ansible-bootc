---
# group_vars/application/vars.yml — non-sensitive variables for the application
# host group.

# Must equal db01's ansible_host in inventory/hosts.yml, or config.ini will
# point at the wrong database host.
db_host: 192.168.122.10

# Must match [server] port in config.ini; used by the app_release readiness
# gate, the app_proof_of_life checks, and expose_app.yml.
app_port: 8080

# Deployment layout — overridable so other teams can adapt path conventions.
# On bootc /opt resolves under /var/opt (persistent, preserved across
# upgrade/rollback); no application code is baked into the image.
app_root: "/opt/corp-app"

# --system-site-packages keeps the baked corporate Python stack visible
# without re-installation.
app_venv: "{{ app_root }}/venv"

# Payload source tree, resolved from inventory_dir so the path holds via
# site.yml, standalone playbooks, and AAP alike.
app_src: "{{ inventory_dir ~ '/../../app/corp-app' }}"

# Entrypoint the rendered corp-app.service unit invokes.
app_entrypoint: "{{ app_venv }}/bin/python3 {{ app_root }}/src/main.py"
