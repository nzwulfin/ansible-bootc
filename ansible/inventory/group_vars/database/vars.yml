# group_vars/database/vars.yml — Non-sensitive variables for the database host group.
#
# Variables here are visible only to hosts in the 'database' group.

# IP address of the application host (app01).
#
# Interface agreement (design-spec.md §7.5, §9): this value MUST be identical to
# app01's ansible_host in inventory/hosts.yml. If they diverge:
#   - The MariaDB account created by mysql_instance will have a host restriction
#     that does not match the actual application host IP, silently blocking connections.
#   - The firewall rich rule will allow the wrong source address.
#
# Used by the mysql_instance role for:
#   - community.mysql.mysql_user host: parameter (account host restriction)
#   - ansible.posix.firewalld rich rule source address (runtime firewall narrowing)
app_host_address: 192.168.122.20   # Must match app01.ansible_host in hosts.yml
