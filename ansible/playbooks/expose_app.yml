---
# expose_app.yml — deliberate, operator-invoked exposure of the application
# port. NOT part of site.yml.
#
# Unlike the database image (fixed port, baked open at build time), the
# application port is instance-specific and belongs in runtime configuration:
# the app host inherits the base image's default-deny baseline (SSH only) and
# this playbook opens exactly the port this application needs.

- name: Expose application port in firewall (deliberate operational step)
  hosts: application
  become: true
  gather_facts: false

  tasks:
    - name: Open application port in firewall
      ansible.posix.firewalld:
        port: "{{ app_port }}/tcp"
        state: enabled
        permanent: true
        immediate: true
