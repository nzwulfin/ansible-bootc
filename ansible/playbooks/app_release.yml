---
# app_release.yml — Application Development, play 2 of 2 (go-live): runs the
# app's Alembic migrations, enables and starts corp-app, and gates on a single
# loopback /health readiness check.
#
# The external firewall port is deliberately NOT opened: the readiness gate runs
# on 127.0.0.1, so the service is loopback-reachable but network-unreachable
# until expose_app.yml is run (default-deny posture). Functional verification
# (seed visibility, write probe, negative input) is proof_of_life.yml, run by
# hand — never part of deployment. See docs/application-design.md.

- name: Release application (run migrations, enable service, verify loopback readiness)
  hosts: application
  gather_facts: true
  become: true

  roles:
    - role: app_release
