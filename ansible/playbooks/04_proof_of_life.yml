---
# ansible/playbooks/04_proof_of_life.yml
#
# Optional, user-invoked verification playbook.
# NOT imported by site.yml — this is NOT a deployment step (G17).
#
# Run by hand after the full deployment sequence (site.yml or the three workload
# playbooks) has completed successfully:
#
#   ansible-playbook playbooks/04_proof_of_life.yml
#   (Run from the ansible/ directory — G11)
#
# AAP usage:
#   A separate, optional job template with the live machine credential. Must NOT
#   be chained into the workload job or triggered automatically by deployment.
#   A user triggers it to demonstrate the system after deployment (G17).
#
# ─────────────────────────────────────────────────────────────────────────────
# What this playbook demonstrates (two deliberate lessons)
# ─────────────────────────────────────────────────────────────────────────────
#
# LESSON 1 — Default-deny: loopback reachability ≠ network reachability (G19)
#
#   After running 03_app_release.yml, the application is:
#     REACHABLE   from within the app host (loopback, 127.0.0.1)
#     UNREACHABLE from the network (external port is closed — default-deny)
#
#   The app_release readiness gate polls http://127.0.0.1:{{ app_port }}/health
#   ON THE APP HOST ITSELF, bypassing the firewall. It passes while the service
#   is externally unreachable. This is the expected and documented post-release
#   state — not a defect.
#
#   Three sub-lessons:
#     (a) Default-deny posture: services do not expose themselves to the network
#         unless a human deliberately opens the port.
#     (b) Loopback ≠ network: a service that works on loopback is not necessarily
#         reachable from any external host. A passing loopback health check is not
#         proof of network reachability.
#     (c) Runtime firewall ownership: the firewall is an intentional operational
#         decision, not an automatic side-effect of deployment.
#
#   Play 1 of this playbook is the deliberate act of opening the port — it
#   labels that act explicitly so the before/after contrast is visible:
#     Before Play 1: curl http://<app_ip>:<app_port>/health from anywhere → FAILS
#     After  Play 1: curl http://<app_ip>:<app_port>/health from anywhere → 200 OK
#
# LESSON 2 — Functional verification is separate from deployment (G17)
#
#   Deployment plays (02_app_deploy.yml, 03_app_release.yml) must not contain
#   functional application exercises. They are:
#     - Non-idempotent (write probes insert rows on every run)
#     - Not deployment prerequisites (the application is deployed whether or
#       not a POST /record succeeds)
#     - A testing concern, not a deployment concern
#
#   All functional verification lives here:
#     - GET /health connected over the network
#     - GET /  — seed-visibility assertion ('ansible-bootstrap' in records)
#     - POST /record — write-verification probe (non-idempotent: adds one row per run)
#     - POST /record {} — negative-path check (assert 400)
#
# ─────────────────────────────────────────────────────────────────────────────
# Non-idempotent probe notice
# ─────────────────────────────────────────────────────────────────────────────
#   Re-running this playbook:
#     - Play 1: the firewall rule is idempotent (ansible.posix.firewalld with
#       permanent+immediate; adding a rule that already exists is a no-op).
#     - Play 2: the POST /record write-verification probe adds one row per run.
#       This is intentional and documented. Do not treat row accumulation as a
#       defect. Probe rows are harmless and document verification history.

# ---------------------------------------------------------------------------
# Play 1: Expose application port in firewall (deliberate teaching step, G19)
# ---------------------------------------------------------------------------
# This play is the explicit, human-readable act of opening the external port.
# Before this play, the application is unreachable from the network even though
# it is running and healthy on loopback. After this play, it is reachable from
# anywhere that can reach the app host on app_port.
#
# This separation is a teaching moment, not a convenience:
#   deploy/release → service running, loopback healthy, network CLOSED
#   this play      → network OPENED (deliberate operator decision)
#   proof of life  → functional verification over the now-open network
# ---------------------------------------------------------------------------

- name: Expose application port in firewall (deliberate teaching step)
  hosts: application
  become: true
  gather_facts: false
  # No gather_facts needed — firewalld module only requires the port and state.

  tasks:
    - name: Open application port in firewall
      ansible.posix.firewalld:
        port: "{{ app_port }}/tcp"
        state: enabled
        permanent: true
        immediate: true
      # This is the deliberate act that makes the application network-reachable.
      #
      # permanent: true  — survives reboots (written to firewalld's permanent zone)
      # immediate: true  — takes effect right now without a firewalld reload
      #
      # G19: Neither app_deploy nor app_release opens this port. The deliberate
      # absence of port exposure in the deployment plays enforces the default-deny
      # posture and makes the firewall decision an explicit operator action, not
      # an automatic side-effect of deployment.
      #
      # Idempotent: running this task when the port is already open is a no-op;
      # firewalld's permanent+immediate combination handles rule deduplication.
      #
      # app_port is declared in group_vars/application/vars.yml (design-spec.md §7.6).
      # It must match the [server] port in /etc/corp-app/config.ini and the
      # app_release readiness gate.

# ---------------------------------------------------------------------------
# Play 2: Functional verification over the network (proof of life)
# ---------------------------------------------------------------------------
# All tasks in the app_proof_of_life role run from the CONTROL NODE
# (delegate_to: localhost) and target http://{{ ansible_host }}:{{ app_port }}/...
# — the external network path, not loopback.
#
# The role asserts (design-spec.md §8.5):
#   1. GET /health  — HTTP 200, database='connected' over the network
#   2. GET /        — 'ansible-bootstrap' seed present in structured records array
#   3. POST /record — 201 with echoed id/message/created_at (non-idempotent probe)
#   4. POST /record {} — 400 rejection (Pydantic validation active over network)
# ---------------------------------------------------------------------------

- name: Verify application over the network (proof of life)
  hosts: application
  gather_facts: false
  # No become: the role tasks run delegate_to: localhost (control node) and
  # connect to the application over HTTP — no privilege escalation required.
  # No gather_facts: the role targets the control node (localhost) and does not
  # need facts about the app host for its URI tasks.

  roles:
    - role: app_proof_of_life
