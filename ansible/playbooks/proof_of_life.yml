---
# proof_of_life.yml — optional functional verification, run by hand; not part of
# site.yml. Health probe, seed visibility (GET /), write probe (POST /record —
# deliberately adds one row per run), and negative-input check (400).

- name: Verify application on host (proof of life)
  hosts: application
  gather_facts: false

  roles:
    - role: app_proof_of_life
