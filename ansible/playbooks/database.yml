---
# database.yml — DBA-owned MariaDB foundation: creates the application database,
# the application account (host-restricted), and narrows the image-baked broad
# mysql firewall service to a source-restricted rule.
#
# Schema and seed data are NOT created here — the app's Alembic migrations own
# them (applied by app_release.yml). Run with the live machine credential.

- name: Provision MariaDB instance (DB foundation)
  hosts: database
  gather_facts: true
  become: true

  roles:
    - role: mariadb_instance
