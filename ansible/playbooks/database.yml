---
# ansible/playbooks/01_database.yml
#
# DBA-owned: DB foundation only — creates the application database, the
# application account with host-restricted privileges, and narrows the firewall
# from the image-baked broad mysql service to a source-restricted rich rule.
#
# SCOPE: Foundation only. This playbook applies NO schema (CREATE TABLE) and NO
# seed data (INSERT INTO). Schema and seed are app-team territory, owned by the
# app's Alembic migrations and applied by 03_app_release.yml. See also:
#   app/corp-app/migrations/    ← authoritative schema definition
#   design-spec.md §8.2, §12 Task 7
#
# Standalone usage (run from the ansible/ directory — G11):
#   ansible-playbook playbooks/01_database.yml
#
# AAP usage:
#   Run as a separate job template with the live machine credential, after
#   00_bootstrap.yml has completed successfully. The live key (configured as
#   the default in ansible.cfg) is the correct credential for this phase.
#   Under AAP, vault variables (app_db_password) are supplied via a custom
#   credential or survey variable; variable names remain identical so no
#   playbook changes are required.
#
# Constraints honoured:
#   G9  — no package management tasks; all runtime dependencies are baked
#         into the database image.
#   G11 — designed to run from the ansible/ directory; all paths in ansible.cfg
#         are relative to that directory.
#   G17 — deployment plays do not create schema or seed data; those are
#         applied by the app team in 03_app_release.yml.

- name: Provision MariaDB instance (DB foundation)
  hosts: database
  gather_facts: true
  become: true

  roles:
    - role: mysql_instance
