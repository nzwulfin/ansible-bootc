---
# bootstrap.yml — onboarding: PSK probe -> key rotation -> live-key verification.
#
# The three-play structure is normative: plays 1-2 override
# ansible_ssh_private_key_file to the bootstrap (PSK) key; play 3 falls back to
# the ansible.cfg default (live key) and fails loudly if any host is
# unreachable — the post-rotation check.
#
# Idempotent onboarding: against an already-onboarded host the PSK probe cannot
# authenticate, rotation is skipped, and play 3 confirms the live key.
#
# AAP: run as its own job template with the bootstrap machine credential. Under
# AAP's one-credential-per-job rule, skip play 3 with --skip-tags live_key_verify;
# live-key verification is implied by the workload job's first connection.

- name: Probe hosts with the bootstrap (PSK) key
  hosts: all
  gather_facts: false
  ignore_unreachable: true
  vars:
    # ansible.cfg defaults to the live key; the bootstrap phase explicitly uses
    # the bootstrap private key. The fallback resolves relative to playbook_dir;
    # bootstrap_key_path (role default or extra var) overrides it when provided.
    ansible_ssh_private_key_file: "{{ bootstrap_key_path | default(playbook_dir ~ '/../keys/id_bootstrap') }}"
  tasks:
    - name: Ping over the PSK
      ansible.builtin.ping:
      register: bp
    - name: Record explicit PSK probe success
      ansible.builtin.set_fact:
        psk_reachable: true
      when: bp is not failed and (bp is not unreachable)

- name: Rotate PSK to live key on successfully probed hosts
  hosts: all
  gather_facts: false
  ignore_unreachable: true
  vars:
    # Rotation still authenticates with the bootstrap key; the role's first
    # task installs the live key.
    ansible_ssh_private_key_file: "{{ bootstrap_key_path | default(playbook_dir ~ '/../keys/id_bootstrap') }}"
  tasks:
    - name: Install the live management key and remove the PSK
      ansible.builtin.include_role:
        name: bootstrap_key_rotation
      # Only a host whose PSK probe explicitly succeeded is rotated. On an
      # onboarded host the PSK is gone, so the probe fails and must never
      # drive rotation.
      when: psk_reachable | default(false)

- name: Verify live key access on all hosts
  hosts: all
  gather_facts: false
  # No key override: the ansible.cfg default (live key) applies. No
  # ignore_unreachable: this play fails loudly if a host is unreachable.
  tags:
    - live_key_verify
  tasks:
    - name: Ping over the live key
      ansible.builtin.ping:
