---
# app_deploy.yml — Application Development, play 1 of 2: installs the payload,
# virtualenv, instance config, and systemd unit.
#
# The service is NOT enabled or started here and no firewall port is opened —
# that is app_release.yml and expose_app.yml.
# Vault variables (app_db_password) come from group_vars or AAP credentials;
# variable names are identical either way.

- name: Deploy application payload and configuration
  hosts: application
  gather_facts: true
  become: true

  roles:
    - role: app_deploy
