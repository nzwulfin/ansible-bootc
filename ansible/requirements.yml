---
# requirements.yml — Ansible collection dependencies for the bootc + Ansible reference pattern.
#
# Install with:
#   cd ansible/
#   ansible-galaxy collection install -r requirements.yml

collections:
  # ansible.mariadb: provides mariadb_db (database creation), mariadb_user (account management),
  # and mariadb_query (arbitrary SQL execution, used for schema and seed-row tasks)
  # used by the mysql_instance role to provision the MariaDB instance at runtime.
  # Replaces community.mysql, which drops MariaDB support in 6.0.0.
  - name: ansible.mariadb
    version: ">=6.0.0"

  # ansible.posix: provides authorized_key (SSH key management) and firewalld (firewall management)
  # used by the bootstrap_key_rotation role (authorized_key) and the mysql_instance role (firewalld).
  - name: ansible.posix
    version: ">=1.5.0"
