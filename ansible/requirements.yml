---
# requirements.yml — Ansible collection dependencies.
# Install: cd ansible/ && ansible-galaxy collection install -r requirements.yml

collections:
  # mariadb_db / mariadb_user for the mariadb_instance role; replaces
  # community.mysql, which drops MariaDB support in 6.0.0.
  - name: ansible.mariadb
    version: ">=6.0.0"

  # authorized_key and firewalld for bootstrap_key_rotation and mariadb_instance.
  - name: ansible.posix
    version: ">=1.5.0"
