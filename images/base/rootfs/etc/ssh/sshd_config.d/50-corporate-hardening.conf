# Corporate SSH hardening baseline (drop-in, global constraint G8).
#
# Delivered exclusively as a drop-in under /etc/ssh/sshd_config.d/. The
# base /etc/ssh/sshd_config is never modified or replaced directly — it
# contains an Include directive for this directory, so these settings are
# layered on top of the distribution defaults.
#
# Key-only authentication, restricted to the ansible management account.
# A fresh VM therefore has no interactive login path for any other
# account; break-glass is the live key or full re-provisioning.

# Key-only authentication: no password logins.
PasswordAuthentication no

# Disable challenge-response (blocks PAM password prompts).
ChallengeResponseAuthentication no

# No root SSH login.
PermitRootLogin no

# Public-key authentication is the management path — stated explicitly.
PubkeyAuthentication yes

# Restrict SSH access to the management account only.
AllowUsers ansible
