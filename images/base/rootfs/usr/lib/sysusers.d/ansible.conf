# sysusers.d declaration for the ansible management account.
#
# systemd-sysusers runs at every boot, before systemd-tmpfiles, so the
# account is created (or corrected to this definition) drift-free across
# image rebuilds and upgrades.
#
# The UID/GID are pinned to 5000:5000 (global constraint G2). The base
# Containerfile applies the same numeric pin to the baked PSK file with
# chown — any divergence would leave the PSK unreadable by the account
# at boot.
#
# This file must NOT create the home directory (that is tmpfiles.d's job,
# see usr/lib/tmpfiles.d/ansible-home.conf) and must NOT set a password.

# Type  Name     ID       GECOS                        Home               Shell
g       ansible  5000
u       ansible  5000:5000 "Ansible management account" /var/home/ansible /bin/bash
