# tmpfiles.d declaration for the ansible management account home tree.
#
# systemd-tmpfiles runs at every boot after systemd-sysusers, so the
# account name resolves in the user/group fields below.
#
# Constraint G3: directory entries only. There is deliberately no f, f~,
# F, w, or any other file-content entry in this file — in particular,
# nothing here may reference /var/home/ansible/.ssh/authorized_keys. An
# f/f~ entry would recreate the bootstrap PSK after key rotation,
# defeating the first-contact-only guarantee. The PSK is baked under
# /var (applied at initial install only, never re-applied by bootc
# upgrade), and no boot-time hook ever resurrects it.
#
# A `d` entry for a directory that already exists is a no-op: neither the
# directory nor its contents are modified at boot.

# Type  Path                        Mode  User    Group   Age
d       /var/home/ansible           0700  ansible ansible -
d       /var/home/ansible/.ssh      0700  ansible ansible -
