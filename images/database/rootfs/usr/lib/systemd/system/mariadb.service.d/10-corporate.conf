# Corporate resource limits for the MariaDB service.
#
# Image-owned unit drop-in (G5): placed under /usr/lib/systemd/system/ so
# the corporate standard updates unconditionally with the image.  Admins who
# need instance-specific tuning run `systemctl edit mariadb`, which writes to
# /etc/systemd/system/mariadb.service.d/override.conf and layers on top of
# these defaults without modifying this file.
#
# Why not PAM limits.d?
#   PAM limit files apply only to login sessions that go through PAM.
#   mariadb.service is launched by systemd directly and bypasses PAM entirely.
#   The unit drop-in is therefore the correct and only reliable mechanism for
#   enforcing resource limits on the database process.

[Service]

# Maximum number of open file descriptors.
# The default systemd soft limit (1024) is far too low for a production
# database: each open table, each client connection, and each InnoDB data
# file consumes at least one file descriptor.  MariaDB documentation
# recommends at minimum 32768 for production workloads; use 65536 to
# provide headroom for larger deployments without requiring per-instance tuning.
LimitNOFILE=65536

# Maximum number of threads (maps to OS process limit for multi-threaded procs).
# MariaDB uses one thread per client connection plus internal worker threads.
# 4096 accommodates high-concurrency deployments; the kernel default (typically
# 1024 or the system nproc limit) is insufficient for busy database servers.
LimitNPROC=4096
