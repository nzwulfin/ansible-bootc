# Corporate database workload tuned profile.
#
# Image-owned (G6): lives under /usr/lib/tuned/corp-database/ so the profile
# updates unconditionally with the image.  The directory name corp-database
# must exactly match the string written to /etc/tuned/active_profile in the
# database Containerfile (G6).
#
# Activated at image-build time by the Containerfile:
#   echo 'corp-database' > /etc/tuned/active_profile
#   echo 'manual'        > /etc/tuned/profile_mode

[main]
summary = Corporate database workload profile — optimises for I/O throughput and consistent latency

# Inherit the platform baseline set by the base image (throughput-performance).
# This provides CPU governor, network, and disk scheduler defaults appropriate
# for a server workload.  The directives below override only the settings that
# database workloads need to change from that baseline.
include = throughput-performance

[vm]
# Transparent Huge Pages must be disabled for database workloads.
# THP compaction runs asynchronously in the background; when it triggers during
# heavy I/O it causes latency spikes (stall events of hundreds of milliseconds)
# that manifest as query outliers.  MariaDB and most other database vendors
# explicitly recommend disabling THP.
transparent_hugepages = never

[sysctl]
# Minimise swapping: database performance depends on keeping the buffer pool in
# RAM.  A swappiness of 1 (not 0 — that can cause OOM-killer issues on older
# kernels) tells the kernel to strongly prefer reclaiming page cache over
# swapping out anonymous pages, protecting InnoDB buffer pool memory.
vm.swappiness = 1

# Increase dirty page write-back thresholds to allow larger I/O bursts.
# The kernel defaults (5 % dirty_ratio / 10 % dirty_background_ratio of total
# RAM) are conservative; raising them allows the I/O scheduler to coalesce
# writes into larger sequential batches, improving throughput on databases with
# mixed read/write workloads.  Writes are still flushed reliably by InnoDB's
# own redo log and doublewrite buffer durability mechanisms.
vm.dirty_ratio = 40
vm.dirty_background_ratio = 10

[disk]
# Request a read-ahead of 4096 sectors (2 MiB at 512 B/sector) on data disks.
# Sequential scans (table scans, bulk inserts, backup operations) benefit
# significantly from aggressive read-ahead; the I/O scheduler merges the
# prefetch into large sequential reads that saturate disk bandwidth.
# For NVMe storage this value can be safely reduced; leave it at 4096 for
# compatibility with HDD-based lab VMs.
readahead = 4096
