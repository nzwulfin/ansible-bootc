# Alembic configuration for corp-app.
#
# IMPORTANT: sqlalchemy.url is intentionally absent from this file.
#
# The database URL is constructed at migration time by env.py, which reads
# /etc/corp-app/config.ini — the same file the running service reads (G12).
# This ensures "alembic upgrade head" and corp-app always target the same
# database. Do NOT add sqlalchemy.url here; doing so would create a second
# source of truth for the DB connection that can silently diverge from the
# deployed config.ini.
#
# RUNNING MIGRATIONS
# ------------------
# Invoked by the app_release Ansible role using the deployed virtualenv:
#
#   {{ app_venv }}/bin/alembic \
#     -c /opt/corp-app/migrations/alembic.ini \
#     upgrade head
#
# Or equivalently from the migrations directory:
#
#   cd /opt/corp-app/migrations && {{ app_venv }}/bin/alembic upgrade head

[alembic]
# Path to migration scripts (env.py, script.py.mako, versions/).
# "." resolves relative to this file's location.
# At runtime: /opt/corp-app/migrations/
script_location = .

# File name template for migration files generated by "alembic revision".
# %(rev)s = revision ID, %(slug)s = slugified message.
file_template = %%(rev)s_%%(slug)s

# Truncate the slug portion of generated file names to this length.
# truncate_slug_length = 40

# Output encoding for generated migration files.
output_encoding = utf-8

# Timezone for "Create Date" in generated revision file headers.
# Defaults to UTC when unset.
# timezone =

[post_write_hooks]
# No post-write hooks; add hooks here if black/isort formatting is desired
# on generated revision files.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
